# The backend holding the agent's own data.

app = "wren-api"
primary_region = "iad"

[build]
  dockerfile = "../api/Dockerfile"

[env]
  LOG_FORMAT = "json"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
